x-minio-config: &x-minio-config
  MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
  MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
  MINIO_SERVER_URL: ${S3_ENDPOINT}

services:
  web:
    image: ghcr.io/phakphum-dev/otog-web:latest
    environment:
      # https://github.com/vercel/next.js/pull/44627
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    networks:
      - api-gateway
    env_file:
      - apps/web/.env.production
      - apps/web/.env.local

  api:
    image: ghcr.io/phakphum-dev/otog-api:latest
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
    networks:
      - api-gateway
      - otog-network
    volumes:
      - ./apps/api/volumes/upload:/app/volumes/upload:rw
      - ./apps/api/docs:/app/docs:rw
      - ./apps/api/source:/app/source:rw
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  postgres:
    image: postgres:14
    container_name: otog-postgres
    restart: unless-stopped
    environment:
      PGPORT: ${DB_PORT}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:${DB_PORT}:${DB_PORT}
    env_file:
      - .env
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - otog-network

  minio:
    image: &silo-image docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: otog-minio
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - ./volumes/minio:/data
    environment:
      <<: *x-minio-config
    command: server --console-address ":9001" /data
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - api-gateway
      - otog-network

  create-bucket:
    image: *silo-image
    container_name: otog-create-bucket
    environment:
      <<: *x-minio-config
      S3_ENDPOINT_URL: http://otog-minio:9000
      BUCKET_NAME: otog
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mcli alias set myminio "$${S3_ENDPOINT_URL}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mcli mb "myminio/$${BUCKET_NAME}" --ignore-existing
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - otog-network

networks:
  otog-network:
    name: otog-network
  api-gateway:
    external: true
